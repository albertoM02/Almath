strictDepBuilds: true
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@capacitor/android@8.5.3"
  - "@capacitor/core@8.5.3"
  - "@capacitor/cli@8.5.3"
overrides:
  # xcode only calls uuid.v4; 11.1.1 retains its CommonJS API and fixes bounds checks.
  "xcode>uuid": 11.1.1
  "@babel/core": ^7.29.6
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  source-map-js: ^1.2.2
  fast-uri: ^3.1.8
  "js-yaml@4": ^4.3.2
  "brace-expansion@1": ^1.1.21
  "brace-expansion@5": ^5.0.12
  sharp: ^0.35.5
