apply plugin: 'com.android.application'

def releaseStore = System.getenv('ALMATH_RELEASE_KEYSTORE')
def releaseAlias = System.getenv('ALMATH_RELEASE_KEY_ALIAS')
def releaseStorePassword = System.getenv('ALMATH_RELEASE_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('ALMATH_RELEASE_KEY_PASSWORD')

android {
    namespace = "io.github.albertom02.almath"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.albertom02.almath"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = (project.findProperty('almathVersionCode') ?: '8').toInteger()
        versionName = "0.5.2-beta"
        manifestPlaceholders = [almathAppLabel: '@string/app_name']
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseStore && releaseAlias && releaseStorePassword && releaseKeyPassword) {
                storeFile file(releaseStore)
                storeType 'PKCS12'
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            // Local developer builds cannot replace official Almath installs.
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            manifestPlaceholders = [almathAppLabel: 'Almath Dev']
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def verifyReleaseIdentity = tasks.register('verifyReleaseIdentity') {
    doLast {
        if (!(releaseStore && releaseAlias && releaseStorePassword && releaseKeyPassword)) {
            throw new GradleException('Official releases require the existing private Almath keystore and all four ALMATH_RELEASE_* environment variables. No fallback key is allowed.')
        }
        def expected = rootProject.file('signing-certificate.sha256').text.trim().toLowerCase(java.util.Locale.ROOT)
        if (!(expected ==~ /[0-9a-f]{64}/)) throw new GradleException('Invalid pinned signing certificate.')
        def store = java.security.KeyStore.getInstance('PKCS12')
        file(releaseStore).withInputStream { stream -> store.load(stream, releaseStorePassword.toCharArray()) }
        if (!store.isKeyEntry(releaseAlias) || store.getKey(releaseAlias, releaseKeyPassword.toCharArray()) == null) {
            throw new GradleException('The release signing alias does not contain the private key.')
        }
        def certificate = store.getCertificate(releaseAlias)
        certificate.checkValidity()
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
        if (actual != expected) throw new GradleException('Signing certificate mismatch. Refusing to build an incompatible official update.')
    }
}
tasks.matching { it.name in ['preReleaseBuild', 'validateSigningRelease'] }.configureEach {
    dependsOn verifyReleaseIdentity
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

